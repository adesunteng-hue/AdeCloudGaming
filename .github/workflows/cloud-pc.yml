name: AdeCloud Gaming

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Update Ubuntu
        run: |
          sudo apt update
          sudo apt upgrade -y

      - name: Install Desktop Environment
        run: |
          sudo apt install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            xorgxrdp

      - name: Check System
        run: |
          echo "=== ADE CLOUD GAMING ==="
          echo "CPU:"
          nproc
          echo "RAM:"
          free -h
          echo "STORAGE:"
          df -h

      - name: Start Desktop
        run: |
          sudo service xrdp start
          echo "Desktop environment installed."
          sleep 30
